[project]
name = "gemsentry"
version = "0.1.0"
description = "Smart RFP acquisition and scoring pipeline for Indian government e-procurement portals"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
    "flask>=3.0.0",
    "openpyxl>=3.1.0",
    "certifi>=2024.0.0",
    "requests>=2.31.0",
    "waitress>=3.0.0",
]

[project.optional-dependencies]
# Optional Tkinter desktop widget (desktop_widget.pyw) — needs Pillow for the
# blurred glass background. Not required by run.py.
widget = ["pillow>=10.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The gemsentry package plus the top-level modules it is driven by. Declaring
# them explicitly is what makes `pip install -e .` work without relocating
# five modules and rewriting ~47 import sites across tools/ and tests/.
packages = ["gemsentry"]
include = [
    "app.py",
    "paths.py",
    "run.py",
    "main.py",
    "scraper.py",
    "logging_setup.py",
    "nlp_classifier.py",
]

[project.scripts]
gemsentry = "run:main"


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only test_*.py. tests/live_test.py and tests/download_and_parse_test.py are
# manual scripts that launch Playwright against the live portal in their module
# body -- pytest's default `*_test.py` pattern collected them, so merely
# *importing* them ran a real scrape on every test run (and fails in CI, which
# has no browser). Run them by hand: `python tests/live_test.py`.
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = ["network: test requires live network access (deselected by default)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The package is run from the source tree, so scripts and tests must extend
# sys.path before they can import project modules. E402 is unavoidable there.
"tests/*" = ["E402"]
"tools/*" = ["E402"]
"app.py" = ["E402"]
