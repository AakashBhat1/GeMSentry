<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeMSentry Dashboard</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="Local interactive review dashboard for acquired tenders and RFPs from Government e-Marketplace (GeM) India.">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --primary-accent: #8b5cf6;
            --primary-accent-glow: rgba(139, 92, 246, 0.15);
            --secondary-accent: #06b6d4;
            --success-color: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --failed-color: #ef4444;
            --failed-bg: rgba(239, 68, 68, 0.1);
            --card-hover-shadow: 0 10px 30px -10px rgba(139, 92, 246, 0.25);
            --sidebar-width: 280px;
        }

        .light-mode {
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.06);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --primary-accent: #6d28d9;
            --primary-accent-glow: rgba(109, 40, 217, 0.1);
            --secondary-accent: #0891b2;
            --success-color: #059669;
            --success-bg: rgba(5, 150, 105, 0.1);
            --failed-color: #dc2626;
            --failed-bg: rgba(220, 38, 38, 0.1);
            --card-hover-shadow: 0 10px 30px -10px rgba(109, 40, 217, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1, h2, h3, .brand {
            font-family: 'Outfit', sans-serif;
        }

        /* Layout Structure */
        header {
            width: 100%;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(11, 15, 25, 0.85);
        }

        .light-mode header {
            background-color: rgba(248, 250, 252, 0.85);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-mark {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1.25rem;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
        }

        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.2;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
            color: white;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--text-secondary);
        }

        .btn-theme {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-theme:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        /* Main container and sidebar */
        .main-container {
            display: flex;
            flex: 1;
            width: 100%;
            position: relative;
        }

        .sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            flex-shrink: 0;
            background-color: rgba(17, 24, 39, 0.2);
        }

        .light-mode .sidebar {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .content-area {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            max-height: calc(100vh - 65px);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Search input */
        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .light-mode .search-box input {
            background-color: rgba(255, 255, 255, 0.7);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px var(--primary-accent-glow);
        }

        .search-box svg {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            width: 1.1rem;
            height: 1.1rem;
            color: var(--text-secondary);
            pointer-events: none;
        }

        /* Filters Section */
        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .filter-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .filter-options {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .filter-options::-webkit-scrollbar {
            width: 4px;
        }
        .filter-options::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .filter-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0.6rem 0.85rem;
            background: none;
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
        }

        .light-mode .filter-btn:hover {
            background-color: rgba(0, 0, 0, 0.03);
        }

        .filter-btn.active {
            background-color: var(--primary-accent-glow);
            color: var(--text-primary);
            font-weight: 600;
        }

        .badge-count {
            background-color: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            padding: 0.1rem 0.5rem;
            border-radius: 99px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .filter-btn.active .badge-count {
            border-color: rgba(139, 92, 246, 0.3);
            background-color: rgba(139, 92, 246, 0.15);
            color: var(--text-primary);
        }

        /* Metrics grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            width: 100%;
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.25);
        }

        .metric-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            font-family: 'Outfit', sans-serif;
        }

        /* Tenders section list */
        .tenders-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 1rem;
        }

        .tenders-section-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .tenders-count-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .tenders-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
        }

        .tender-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .tender-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: transparent;
            transition: background-color 0.2s;
        }

        .tender-card:hover {
            border-color: rgba(139, 92, 246, 0.2);
            box-shadow: var(--card-hover-shadow);
            transform: scale(1.005);
        }

        .tender-card:hover::before {
            background: linear-gradient(to bottom, var(--primary-accent), var(--secondary-accent));
        }

        .tender-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1.5rem;
        }

        .tender-title-area {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .tender-title {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .tender-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }

        .tag {
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.725rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .tag-id {
            background-color: rgba(6, 182, 212, 0.1);
            color: var(--secondary-accent);
            border: 1px solid rgba(6, 182, 212, 0.2);
        }

        .tag-keyword {
            background-color: rgba(139, 92, 246, 0.1);
            color: var(--primary-accent);
            border: 1px solid rgba(139, 92, 246, 0.2);
            text-transform: capitalize;
        }

        /* Statuses & Badges */
        .status-area {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.85rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .status-shortlisted {
            background-color: var(--success-bg);
            color: var(--success-color);
            border-color: rgba(16, 185, 129, 0.2);
        }

        .status-pending {
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            border-color: rgba(245, 158, 11, 0.2);
        }

        .status-rejected {
            background-color: var(--failed-bg);
            color: var(--failed-color);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .score-badge {
            font-size: 0.725rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            border: 1px solid transparent;
        }

        .score-high {
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .score-medium {
            background-color: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border-color: rgba(245, 158, 11, 0.3);
        }

        .score-low {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
            display: inline-block;
        }

        /* Detail grids */
        .tender-details-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.25rem;
            background-color: rgba(0, 0, 0, 0.15);
            padding: 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .light-mode .tender-details-grid {
            background-color: rgba(255, 255, 255, 0.4);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .detail-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detail-value {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Accordion style details */
        .tender-analysis-details {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.01);
            overflow: hidden;
            font-size: 0.85rem;
        }

        .light-mode .tender-analysis-details {
            background-color: rgba(0, 0, 0, 0.01);
        }

        .tender-analysis-details summary {
            padding: 0.5rem 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            outline: none;
            transition: all 0.2s;
        }

        .tender-analysis-details summary:hover {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
        }

        .analysis-content {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .analysis-grid div strong {
            color: var(--text-primary);
        }

        .analysis-reasons {
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            padding-top: 0.5rem;
            border-top: 1px dashed var(--border-color);
        }

        .analysis-reasons ul {
            padding-left: 1.2rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        /* Action elements styling */
        .tender-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .override-controls {
            display: flex;
            gap: 0.4rem;
        }

        .btn-override {
            padding: 0.4rem 0.75rem;
            font-size: 0.75rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .btn-override:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
        }

        .btn-override.active-short {
            background-color: rgba(16, 185, 129, 0.12);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.25);
        }

        .btn-override.active-pending {
            background-color: rgba(245, 158, 11, 0.12);
            color: #f59e0b;
            border-color: rgba(245, 158, 11, 0.25);
        }

        .btn-override.active-rejected {
            background-color: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.25);
        }

        /* Error/Empty status screen */
        .state-container {
            padding: 4rem 2rem;
            text-align: center;
            max-width: 500px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
        }

        .state-icon {
            font-size: 3.5rem;
            filter: drop-shadow(0 4px 10px rgba(139, 92, 246, 0.3));
        }

        .state-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .state-message {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Modal Glassmorphic UI */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(7, 10, 19, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.85rem;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.75rem;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        /* Keywords Grid */
        .keywords-grid-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .keywords-toolbar {
            display: flex;
            gap: 0.5rem;
        }

        .keywords-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.5rem;
            max-height: 220px;
            overflow-y: auto;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
        }

        .light-mode .keywords-grid {
            background-color: rgba(255, 255, 255, 0.5);
        }

        .keyword-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            padding: 0.25rem;
            border-radius: 4px;
            transition: background-color 0.15s;
        }

        .keyword-item:hover {
            color: var(--text-primary);
            background-color: rgba(255, 255, 255, 0.03);
        }

        .keyword-item input {
            accent-color: var(--primary-accent);
            cursor: pointer;
            width: 1rem;
            height: 1rem;
        }

        /* Console logs */
        .console-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .console-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .console-logs {
            background: #030712;
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            padding: 1rem;
            color: #34d399;
            height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }

        .console-logs::-webkit-scrollbar {
            width: 6px;
        }

        .console-logs::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 1.5rem;
            }
            .content-area {
                max-height: none;
            }
            .metrics-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .tender-details-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="header-left">
            <div class="logo-mark">GS</div>
            <div class="logo-text">
                <h1>GeMSentry Hub</h1>
                <p>Smart RFP Acquisition & Scraper Dashboard</p>
            </div>
        </div>
        <div class="header-right">
            <button class="btn btn-primary" onclick="openScraperModal()">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                Scrape Portal
            </button>
            <button class="btn-theme" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle Theme">
                <svg id="themeIcon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                <span id="themeText">Dark Mode</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="main-container" id="mainContainer">
        <!-- Sidebar Filters -->
        <aside class="sidebar">
            <div class="search-box">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" id="searchInput" placeholder="Search title, department, ID..." oninput="filterData()">
            </div>

            <!-- Dynamic Keyword Filter -->
            <div class="filter-section">
                <span class="filter-title">Keywords</span>
                <div class="filter-options" id="keywordFilters">
                    <!-- Loaded dynamically from tenders data -->
                </div>
            </div>

            <!-- Triage Evaluation Status Filter -->
            <div class="filter-section">
                <span class="filter-title">Evaluation Status</span>
                <div class="filter-options" id="statusFilters">
                    <button class="filter-btn active" id="stat-all" onclick="setStatusFilter('all')">
                        <span>All Tenders</span>
                        <span class="badge-count" id="stat-cnt-all">0</span>
                    </button>
                    <button class="filter-btn" id="stat-shortlisted" onclick="setStatusFilter('Shortlisted')">
                        <span>Shortlisted</span>
                        <span class="badge-count" id="stat-cnt-short">0</span>
                    </button>
                    <button class="filter-btn" id="stat-pending" onclick="setStatusFilter('Pending Review')">
                        <span>Pending Review</span>
                        <span class="badge-count" id="stat-cnt-pending">0</span>
                    </button>
                    <button class="filter-btn" id="stat-rejected" onclick="setStatusFilter('Rejected')">
                        <span>Rejected</span>
                        <span class="badge-count" id="stat-cnt-rejected">0</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Dashboard View -->
        <main class="content-area" id="contentArea">
            <!-- Metrics Cards Row -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <span class="metric-title">Total Tenders Found</span>
                    <span class="metric-value" id="metric-total">0</span>
                </div>
                <div class="metric-card">
                    <span class="metric-title">Shortlisted Bids</span>
                    <span class="metric-value" id="metric-downloaded" style="color: var(--success-color);">0</span>
                </div>
                <div class="metric-card">
                    <span class="metric-title">Acceptance Ratio</span>
                    <span class="metric-value" id="metric-ratio">0%</span>
                </div>
            </div>

            <!-- Tenders List Section -->
            <div class="tenders-section-header">
                <h2>Discovered Tenders</h2>
                <div class="tenders-count-info">
                    Showing <strong id="visible-count">0</strong> of <strong id="total-count">0</strong> tenders
                </div>
            </div>

            <div class="tenders-list" id="tendersList">
                <!-- Dynamic Content Injected Here -->
            </div>
        </main>
    </div>

    <!-- Scraper Modal Overlay -->
    <div id="scraperModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">GeM Scraper Control Center</h3>
                <button class="close-btn" onclick="closeScraperModal()">&times;</button>
            </div>
            
            <div class="keywords-grid-container">
                <span class="filter-title" style="margin-bottom: 0.25rem; display: block;">Select Keywords to Scrape</span>
                <div class="keywords-toolbar">
                    <button class="btn btn-secondary" onclick="selectAllKeywords()" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; border-radius: 4px;">Select All</button>
                    <button class="btn btn-secondary" onclick="clearAllKeywords()" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; border-radius: 4px;">Clear All</button>
                </div>
                <div class="keywords-grid" id="modalKeywordsGrid">
                    <!-- Loaded dynamically from /api/keywords -->
                </div>
            </div>

            <div style="display: flex; gap: 1rem; align-items: center; justify-content: space-between; width: 100%;">
                <div style="display: flex; flex-direction: column; gap: 0.25rem;">
                    <label style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 500;">Page Limit (per keyword)</label>
                    <select id="modalPageLimit" style="background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.4rem; border-radius: 6px; font-size: 0.85rem; outline: none; cursor: pointer; width: 180px;">
                        <option value="1">1 Page (10 Tenders)</option>
                        <option value="2" selected>2 Pages (20 Tenders)</option>
                        <option value="3">3 Pages (30 Tenders)</option>
                        <option value="5">5 Pages (50 Tenders)</option>
                    </select>
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.25rem;">
                    <label style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 500;">GeM Search Sorting</label>
                    <select id="modalSortOrder" style="background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.4rem; border-radius: 6px; font-size: 0.85rem; outline: none; cursor: pointer; width: 220px;">
                        <option value="Bid-End-Date-Latest" selected>Bid End Date: Latest First</option>
                        <option value="Bid-End-Date-Oldest">Bid End Date: Oldest First</option>
                        <option value="Bid-Start-Date-Latest">Bid Start Date: Latest First</option>
                        <option value="Bid-Start-Date-Oldest">Bid Start Date: Oldest First</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="startScrapeBtn" onclick="triggerScrape()" style="align-self: flex-end; padding: 0.55rem 1.75rem; border-radius: 8px; margin-left: auto;">
                    Start Scraper
                </button>
            </div>

            <div class="console-container">
                <div class="console-title">Live Scraper Console Output</div>
                <div class="console-logs" id="consoleLogs">Waiting to start...</div>
            </div>
        </div>
    </div>

    <!-- Script loading and dynamic injector -->
    <script>
        // Default filters state
        let currentKeyword = 'all';
        let currentStatus = 'all';
        let searchStr = '';
        let tenders = [];
        let pollingInterval = null;
        let knownKeywords = [];

        // Check theme cookie/setting
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            updateThemeButton(true);
        }

        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            updateThemeButton(isLight);
        }

        function updateThemeButton(isLight) {
            const themeText = document.getElementById('themeText');
            const themeIcon = document.getElementById('themeIcon');
            if (isLight) {
                themeText.innerText = 'Light Mode';
                themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14 12a2 2 0 11-4 0 2 2 0 014 0z" />`;
            } else {
                themeText.innerText = 'Dark Mode';
                themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />`;
            }
        }

        // Fetch data from local Flask API on load
        window.addEventListener('DOMContentLoaded', () => {
            refreshData();
            loadKeywordsForModal();
        });

        async function refreshData() {
            try {
                const response = await fetch('/api/tenders');
                const data = await response.json();
                tenders = data.tenders || [];
                initDashboard();
            } catch (err) {
                console.error("Failed to load tenders from API:", err);
                showSetupState();
            }
        }

        async function loadKeywordsForModal() {
            try {
                const response = await fetch('/api/keywords');
                const data = await response.json();
                knownKeywords = data.keywords || [];
                
                const grid = document.getElementById('modalKeywordsGrid');
                grid.innerHTML = knownKeywords.map(kw => `
                    <label class="keyword-item">
                        <input type="checkbox" name="keywordCheckbox" value="${kw}">
                        <span>${kw}</span>
                    </label>
                `).join('');
            } catch (err) {
                console.error("Failed to load keywords for modal:", err);
            }
        }

        function selectAllKeywords() {
            const boxes = document.getElementsByName('keywordCheckbox');
            boxes.forEach(b => b.checked = true);
        }

        function clearAllKeywords() {
            const boxes = document.getElementsByName('keywordCheckbox');
            boxes.forEach(b => b.checked = false);
        }

        function openScraperModal() {
            document.getElementById('scraperModal').style.display = 'flex';
            checkScraperStatus();
            if (!pollingInterval) {
                pollingInterval = setInterval(checkScraperStatus, 1000);
            }
        }

        function closeScraperModal() {
            document.getElementById('scraperModal').style.display = 'none';
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }

        async function checkScraperStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                const consoleLogs = document.getElementById('consoleLogs');
                const startBtn = document.getElementById('startScrapeBtn');
                
                if (data.status === 'running') {
                    startBtn.disabled = true;
                    startBtn.innerText = 'Scraping...';
                    startBtn.style.opacity = '0.6';
                    
                    if (data.logs && data.logs.length > 0) {
                        consoleLogs.innerText = data.logs.join('\n');
                        consoleLogs.scrollTop = consoleLogs.scrollHeight;
                    } else {
                        consoleLogs.innerText = 'Scraper starting up...';
                    }
                } else {
                    startBtn.disabled = false;
                    startBtn.innerText = 'Start Scraper';
                    startBtn.style.opacity = '1';
                    
                    if (data.logs && data.logs.length > 0) {
                        consoleLogs.innerText = data.logs.join('\n') + '\n\n[SUCCESS] Scraper completed execution. Dashboard data updated.';
                        consoleLogs.scrollTop = consoleLogs.scrollHeight;
                        
                        // Stop polling and update main dashboard
                        clearInterval(pollingInterval);
                        pollingInterval = null;
                        refreshData();
                    }
                }
            } catch (err) {
                console.error("Error checking status:", err);
            }
        }

        async function triggerScrape() {
            const checkboxes = document.getElementsByName('keywordCheckbox');
            const selected = [];
            checkboxes.forEach(b => {
                if (b.checked) selected.push(b.value);
            });
            
            if (selected.length === 0) {
                alert("Please select at least one keyword to scrape.");
                return;
            }
            
            const maxPages = parseInt(document.getElementById('modalPageLimit').value);
            const sortOrder = document.getElementById('modalSortOrder').value;
            
            try {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keywords: selected, max_pages: maxPages, sort_order: sortOrder })
                });
                const resData = await response.json();
                if (resData.error) {
                    alert(resData.error);
                } else {
                    document.getElementById('consoleLogs').innerText = 'Triggering background scraper...';
                    
                    // Restart polling if stopped
                    if (!pollingInterval) {
                        pollingInterval = setInterval(checkScraperStatus, 1000);
                    }
                }
            } catch (err) {
                console.error("Failed to start scrape:", err);
                alert("Failed to start scrape. Please try again.");
            }
        }

        async function overrideStatus(bidNo, newStatus) {
            try {
                const response = await fetch('/api/tenders/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bid_no: bidNo, status: newStatus })
                });
                const resData = await response.json();
                if (resData.error) {
                    alert(resData.error);
                } else {
                    // Update locally and re-populate
                    const tender = tenders.find(t => t.bid_no === bidNo);
                    if (tender) {
                        tender.status = newStatus;
                        initDashboard();
                    }
                }
            } catch (err) {
                console.error("Error overriding status:", err);
                alert("Failed to update tender evaluation status.");
            }
        }

        function showSetupState() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="state-container">
                    <div class="state-icon">📡</div>
                    <h2 class="state-title">No Scraped Data Discovered</h2>
                    <p class="state-message">
                        The dashboard backend is running, but it looks like you haven't run the scraper yet or the metadata file is missing in the <code>tenders/</code> folder.
                    </p>
                    <p class="state-message">
                        Click the "Scrape Portal" button in the top right to start a keyword search and download RFPs.
                    </p>
                </div>
            `;
        }

        function initDashboard() {
            const container = document.getElementById('mainContainer');
            
            // Restore content area if it was replaced by setup state
            if (!document.getElementById('contentArea')) {
                window.location.reload();
                return;
            }

            // Populate metrics
            const total = tenders.length;
            const shortlisted = tenders.filter(t => t.status === 'Shortlisted').length;
            const ratio = total > 0 ? Math.round((shortlisted / total) * 100) : 0;

            document.getElementById('metric-total').innerText = total;
            document.getElementById('metric-downloaded').innerText = shortlisted;
            document.getElementById('metric-ratio').innerText = ratio + '%';

            // Populate badges and render filters
            updateBadges();
            filterData();
        }

        function renderKeywordFilters() {
            const filtersContainer = document.getElementById('keywordFilters');
            
            let html = `
                <button class="filter-btn ${currentKeyword === 'all' ? 'active' : ''}" id="kw-all" onclick="setKeywordFilter('all')">
                    <span>All Tenders</span>
                    <span class="badge-count">${tenders.length}</span>
                </button>
            `;
            
            const uniqueKeywords = new Set();
            tenders.forEach(t => {
                t.keyword.split(',').forEach(k => {
                    const clean = k.strip ? k.strip() : k.trim();
                    if (clean) uniqueKeywords.add(clean);
                });
            });
            
            Array.from(uniqueKeywords).sort().forEach(kw => {
                const kwLower = kw.toLowerCase();
                const count = tenders.filter(t => t.keyword.toLowerCase().includes(kwLower)).length;
                html += `
                    <button class="filter-btn ${currentKeyword === kwLower ? 'active' : ''}" onclick="setKeywordFilter('${kwLower}')">
                        <span style="text-transform: capitalize;">${kw}</span>
                        <span class="badge-count">${count}</span>
                    </button>
                `;
            });
            
            filtersContainer.innerHTML = html;
        }

        function updateBadges() {
            renderKeywordFilters();

            // Evaluation status counts
            document.getElementById('stat-cnt-all').innerText = tenders.length;
            document.getElementById('stat-cnt-short').innerText = tenders.filter(t => t.status === 'Shortlisted').length;
            document.getElementById('stat-cnt-pending').innerText = tenders.filter(t => t.status === 'Pending Review' || !t.status).length;
            document.getElementById('stat-cnt-rejected').innerText = tenders.filter(t => t.status === 'Rejected').length;
        }

        function setKeywordFilter(kw) {
            currentKeyword = kw;
            renderKeywordFilters();
            filterData();
        }

        function setStatusFilter(status) {
            const btns = document.querySelectorAll('#statusFilters .filter-btn');
            btns.forEach(b => b.classList.remove('active'));

            if (status === 'all') document.getElementById('stat-all').classList.add('active');
            else if (status === 'Shortlisted') document.getElementById('stat-shortlisted').classList.add('active');
            else if (status === 'Pending Review') document.getElementById('stat-pending').classList.add('active');
            else if (status === 'Rejected') document.getElementById('stat-rejected').classList.add('active');

            currentStatus = status;
            filterData();
        }

        function filterData() {
            searchStr = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = tenders.filter(t => {
                const matchKeyword = currentKeyword === 'all' || t.keyword.toLowerCase().includes(currentKeyword);
                
                const tStatus = t.status || 'Pending Review';
                const matchStatus = currentStatus === 'all' || tStatus === currentStatus;
                
                const matchSearch = searchStr === '' ||
                                    t.title.toLowerCase().includes(searchStr) ||
                                    t.bid_no.toLowerCase().includes(searchStr) ||
                                    t.department.toLowerCase().includes(searchStr);

                return matchKeyword && matchStatus && matchSearch;
            });

            renderTenders(filtered);
        }

        function renderTenders(items) {
            const listContainer = document.getElementById('tendersList');
            document.getElementById('visible-count').innerText = items.length;
            document.getElementById('total-count').innerText = tenders.length;

            if (items.length === 0) {
                listContainer.innerHTML = `
                    <div class="state-container" style="margin: 2rem auto; width: 100%;">
                        <div style="font-size: 2.5rem;">🔍</div>
                        <h3 class="state-title">No matching tenders found</h3>
                        <p class="state-message">Try adjusting your filters or search query.</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = items.map(tender => {
                const keywordsList = tender.keyword.split(',').map(kw => `<span class="tag tag-keyword">${kw.trim()}</span>`).join(' ');
                
                // Score Badge and Classification Badge
                let statusClass = 'status-pending';
                let statusText = tender.status || 'Pending Review';
                if (statusText === 'Shortlisted') statusClass = 'status-shortlisted';
                if (statusText === 'Rejected') statusClass = 'status-rejected';

                let scoreBadge = '';
                let detailsAccordion = '';
                const analysis = tender.analysis;
                
                if (analysis) {
                    let scoreClass = 'score-medium';
                    if (analysis.score >= 7) scoreClass = 'score-high';
                    if (analysis.score <= 4) scoreClass = 'score-low';
                    
                    scoreBadge = `<span class="score-badge ${scoreClass}">Score: ${analysis.score}/10</span>`;
                    
                    // Render details accordion
                    const reasonsHtml = (analysis.reasons || []).map(r => `<li>${r}</li>`).join('');
                    const epbgVal = analysis.epbg_required === 'Yes' ? (analysis.epbg_percentage || 'Yes') : 'No';
                    const prebidVal = analysis.pre_bid_required === 'Yes' ? (analysis.pre_bid_date || 'Yes') : 'No';
                    
                    detailsAccordion = `
                        <details class="tender-analysis-details">
                            <summary>View Automated RFP Score Details</summary>
                            <div class="analysis-content">
                                <div class="analysis-grid">
                                    <div><strong>EMD Amount:</strong> ${analysis.emd_status || 'N/A'}</div>
                                    <div><strong>Startup Relaxation:</strong> ${analysis.startup_exemption || 'No'}</div>
                                    <div><strong>MSE Relaxation:</strong> ${analysis.mse_exemption || 'No'}</div>
                                    <div><strong>Pre-Bid Meeting:</strong> ${prebidVal}</div>
                                    <div><strong>ePBG Guarantee:</strong> ${epbgVal}</div>
                                </div>
                                <div class="analysis-reasons">
                                    <strong>Evaluation Analysis:</strong>
                                    <ul>
                                        ${reasonsHtml}
                                    </ul>
                                </div>
                            </div>
                        </details>
                    `;
                } else {
                    scoreBadge = `<span class="score-badge score-low" style="background: rgba(255,255,255,0.02); color: var(--text-secondary); border-color: var(--border-color);">Score: --/10</span>`;
                }

                const localPath = tender.local_pdf_path.startsWith('tenders/') 
                    ? tender.local_pdf_path 
                    : `tenders/downloads/${tender.local_pdf_path}`;
                
                const actionButtons = tender.downloaded
                    ? `<a href="${localPath}" target="_blank" class="btn btn-primary" style="padding: 0.45rem 1rem; font-size: 0.8rem;">
                            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            View RFP Document
                       </a>`
                    : `<span class="state-message" style="font-size: 0.8rem; font-style: italic;">RFP download not available.</span>`;

                return `
                    <div class="tender-card">
                        <div class="tender-header">
                            <div class="tender-title-area">
                                <div class="tender-tags">
                                    <span class="tag tag-id">${tender.bid_no}</span>
                                    ${keywordsList}
                                </div>
                                <h3 class="tender-title">${tender.title}</h3>
                            </div>
                            <div class="status-area">
                                <div class="status-badge ${statusClass}"><span class="status-dot"></span>${statusText}</div>
                                ${scoreBadge}
                            </div>
                        </div>

                        <div class="tender-details-grid">
                            <div class="detail-item">
                                <span class="detail-label">Quantity</span>
                                <span class="detail-value">${tender.quantity || 'N/A'}</span>
                            </div>
                            <div class="detail-item" style="grid-column: span 2;">
                                <span class="detail-label">Department / Organisation</span>
                                <span class="detail-value">${tender.department || 'N/A'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">End Date (Deadline)</span>
                                <span class="detail-value">${tender.end_date || 'N/A'}</span>
                            </div>
                        </div>

                        ${detailsAccordion}

                        <div class="tender-actions">
                            <div style="display: flex; gap: 0.75rem; align-items: center;">
                                ${actionButtons}
                                <a href="${tender.pdf_url}" target="_blank" class="btn btn-secondary" style="padding: 0.45rem 1rem; font-size: 0.8rem;">
                                    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                    </svg>
                                    GeM Link
                                </a>
                            </div>
                            
                            <div class="override-controls">
                                <button class="btn-override ${statusText === 'Shortlisted' ? 'active-short' : ''}" onclick="overrideStatus('${tender.bid_no}', 'Shortlisted')" title="Shortlist Tender">
                                    🟢 Shortlist
                                </button>
                                <button class="btn-override ${statusText === 'Pending Review' ? 'active-pending' : ''}" onclick="overrideStatus('${tender.bid_no}', 'Pending Review')" title="Mark Pending">
                                    🟡 Pending
                                </button>
                                <button class="btn-override ${statusText === 'Rejected' ? 'active-rejected' : ''}" onclick="overrideStatus('${tender.bid_no}', 'Rejected')" title="Reject Tender">
                                    🔴 Reject
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
